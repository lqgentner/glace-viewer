# Python, Node, and tippecanoe are locked by pixi; jsdom is locked by npm.
[workspace]
name = "glace-viewer"
description = "Interactive web map viewer for GLACE – Sentinel-1 coherence and backscatter composites of the European Alps."
license = "MIT"
license-file = "LICENSE"
readme = "README.md"
channels = ["conda-forge"]
# Supported development platforms; conda-forge has no Windows tippecanoe build.
platforms = ["linux-64", "osx-arm64"]
# Minimum pixi version; CI installs the latest release.
requires-pixi = ">=0.80"

[dependencies]
python = "3.12.*"
nodejs = "24.*"
# Pin tile generation for reproducible builds.
tippecanoe = "==2.79.0"

[tasks]
# Development dependencies only; the browser loads modules directly.
install = "npm ci"
test-py = "python -m unittest discover -s tests -v"
test-js = { cmd = "npm test", depends-on = ["install"] }
test = { depends-on = ["test-py", "test-js"] }
build-tiles = "python scripts/build-tiles.py"
serve = "python scripts/serve.py"
