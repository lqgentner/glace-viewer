name: Tests

# The deploy workflow calls this for main pushes, avoiding duplicate test runs.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Cache the locked environment. Pin setup-pixi to a release while it is pre-1.0;
      # Dependabot updates the action, and pixi.toml sets the minimum pixi version.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true
      # Run both suites; the JavaScript task installs jsdom from the npm lockfile.
      - run: pixi run --locked test
