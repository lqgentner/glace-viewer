name: Deploy to Pages

# Build inventory archives from committed GeoJSON before publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments without interrupting one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Test the exact commit being published.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true

      - name: Build vector tiles
        run: |
          pixi run --locked tippecanoe --version
          pixi run --locked build-tiles

      - name: Install the page's libraries
        run: pixi run --locked install

      # Publish the runtime files, generated archives and the page's libraries,
      # excluding source GeoJSON.
      - name: Stage the site
        run: |
          mkdir -p _site/data
          cp index.html style.css site-config.js sw.js _site/
          cp -r js assets _site/
          cp data/*.pmtiles data/inventories.json _site/data/
          pixi run --locked node scripts/stage-libraries.mjs _site
          du -sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
