name: Deploy to Pages

# Build inventory archives from committed GeoJSON before publishing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deployments without interrupting one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

# The tippecanoe release that builds the inventory archives. Dependabot does not
# move it; a new version needs a full rebuild, which every deploy does.
env:
  TIPPECANOE_VERSION: "2.79.0"

jobs:
  # Test the exact commit being published.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node's major version comes from .node-version; npm's cache from package-lock.json.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install the page's libraries
        run: npm ci

      # tippecanoe is built from source once per version and runner image, and
      # cached. ImageOS (ubuntu24, …) is the runner's, which the env context lacks.
      - id: image
        run: echo "os=$ImageOS" >> "$GITHUB_OUTPUT"

      - id: tippecanoe
        uses: actions/cache@v5
        with:
          path: ~/.local/bin/tippecanoe
          key: tippecanoe-${{ env.TIPPECANOE_VERSION }}-${{ steps.image.outputs.os }}-${{ runner.arch }}

      - name: Build tippecanoe
        if: steps.tippecanoe.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y --no-install-recommends libsqlite3-dev zlib1g-dev
          git clone --quiet --depth 1 --branch "$TIPPECANOE_VERSION" \
            https://github.com/felt/tippecanoe.git "$RUNNER_TEMP/tippecanoe"
          make -C "$RUNNER_TEMP/tippecanoe" -j"$(nproc)" tippecanoe
          install -D "$RUNNER_TEMP/tippecanoe/tippecanoe" ~/.local/bin/tippecanoe

      - name: Build vector tiles
        run: |
          ~/.local/bin/tippecanoe --version
          npm run build-tiles -- --tippecanoe ~/.local/bin/tippecanoe

      # Publish the runtime files, generated archives and the page's libraries,
      # excluding source GeoJSON.
      - name: Stage the site
        run: |
          mkdir -p _site/data
          cp index.html style.css site-config.js sw.js _site/
          cp -r js assets _site/
          cp data/*.pmtiles data/inventories.json _site/data/
          node scripts/stage-libraries.mjs _site
          du -sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
