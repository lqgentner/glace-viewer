name: Deploy to Pages

# The repository stores the inventories as GeoJSON; the vector PMTiles the page
# actually loads are built here, so the archives never enter git history.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, but never cancel one in flight: a half-published site is
# worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same suites the pull request ran, re-run against the commit that is
  # about to be published: a red build must not reach Pages.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # tippecanoe comes from conda-forge through pixi.lock, pinned there so a
      # rebuild of an old commit produces the same tiles.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Build vector tiles
        run: |
          pixi run --locked tippecanoe --version
          pixi run --locked build-tiles

      # Only the archives are published, never the GeoJSON they were built from:
      # shipping both would double what a visitor could download for no gain.
      - name: Stage the site
        run: |
          mkdir -p _site/data
          cp index.html style.css site-config.js _site/
          cp -r js assets _site/
          cp data/*.pmtiles data/inventories.json _site/data/
          du -sh _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
