# Moves the action versions in the workflows, and the npm packages (the page's libraries and test tools),
# monthly and in one pull request each; the seven-day cooldown skips releases
# too fresh to have had their regressions reported. TIPPECANOE_VERSION in
# deploy.yml is not Dependabot's: move it by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
