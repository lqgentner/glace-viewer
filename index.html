<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Hashes allow the two inline scripts below; page-assets.test.js checks them.
         MapLibre runs its worker from a blob that imports from unpkg, which worker-src
         governs, and stores may live on any HTTPS host. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self' https://unpkg.com https://esm.sh 'sha256-hnvnq61naOLqPcnUawD5h8TgoJLfUcvBIdEzljK4Me4=' 'sha256-6h8qqahDQjUTtzvmhn+n6/MoNHltOJxupIIfNqSXRTI='; style-src 'self' https://unpkg.com; img-src 'self' data: blob:; connect-src 'self' https: data: blob:; worker-src 'self' blob: https://unpkg.com; object-src 'none'; base-uri 'self'; form-action 'none'" />
    <title>GLACE — Sentinel-1 composites, European Alps</title>
    <meta name="description"
          content="Explore annual Sentinel-1 coherence and backscatter composites of the European Alps, with glacier inventories, hillshade and 3D terrain." />

    <!-- Use relative asset paths for Pages project subpaths. -->
    <link rel="icon" href="assets/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="manifest" href="assets/site.webmanifest" />
    <meta name="theme-color" content="#10141c" />

    <!-- Start the catalog read before the scripts load. Keep it equal to
         site-config.js's tilesBase + config.js's mosaicCollection. -->
    <link rel="preload" href="https://data.source.coop/giuz/glace-alps/mosaics/collection.json"
          as="fetch" crossorigin />
    <link rel="preconnect" href="https://api.protomaps.com" crossorigin />
    <link rel="preconnect" href="https://protomaps.github.io" crossorigin />

    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css"
          integrity="sha384-pGcTesCDxgCFx0yvZdwOw9yHx4Gw6kQK19wigRk1RcuDoLTLdbPMEnK7w8e9MgjS"
          crossorigin="anonymous" />
    <link rel="stylesheet" href="style.css" />

    <!-- Parse the import map before any module fetch. MapLibre loads sibling chunks
         and a worker; PMTiles needs the bare fflate mapping. Integrity covers every
         CDN module, including those preloaded below. -->
    <script type="importmap">
      {
        "imports": {
          "maplibre-gl": "https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.mjs",
          "pmtiles": "https://unpkg.com/pmtiles@4.5.0/dist/esm/index.js",
          "fflate": "https://unpkg.com/fflate@0.8.3/esm/browser.js",
          "@protomaps/basemaps": "https://unpkg.com/@protomaps/basemaps@5.7.2/dist/esm/index.js"
        },
        "integrity": {
          "https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.mjs": "sha384-vBS3VmrCg3Nx8PUcTevNEjjj7+TCKU6VjJdezON8yplGOARpTkld7CN+keiqcPmj",
          "https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl-shared.mjs": "sha384-OGp4zg2g805tukqDpmZzKOURd8MNCD2kvcC/OxRKuwSGKokyy00oiZ5ULT1Gl99V",
          "https://unpkg.com/pmtiles@4.5.0/dist/esm/index.js": "sha384-Ohx3fvw/UYxrc8vmqvMaO2aAWouBFSe7w9VKOU/siixKmoPu14eYMCPNz+k8CPTW",
          "https://unpkg.com/fflate@0.8.3/esm/browser.js": "sha384-qEYGUupjunWfiQrMjBBQ8XYX03MQwNxGZJuPkxRr/5vErQwQZwbqaBxk/pjvWAx6",
          "https://unpkg.com/@protomaps/basemaps@5.7.2/dist/esm/index.js": "sha384-4gIgDkmrvXb4bDGA88krbayOq48DRB8Eljy1EP01Z/i9e8qIqDZOfbLaxHoBZ60g"
        }
      }
    </script>

    <!-- Fetch modules found only one or two imports deep in parallel with their
         importers. page-assets.test.js requires every js/ module but app.js here. -->
    <link rel="modulepreload" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl-shared.mjs" />
    <link rel="modulepreload" href="https://unpkg.com/fflate@0.8.3/esm/browser.js" />
    <link rel="modulepreload" href="js/config.js" />
    <link rel="modulepreload" href="js/map.js" />
    <link rel="modulepreload" href="js/overlays.js" />
    <link rel="modulepreload" href="js/rasters.js" />
    <link rel="modulepreload" href="js/ui.js" />
    <link rel="modulepreload" href="js/archive.js" />
    <link rel="modulepreload" href="js/composite.js" />
    <link rel="modulepreload" href="js/sky.js" />
    <link rel="modulepreload" href="js/store.js" />
    <link rel="modulepreload" href="js/tile-grid.js" />
    <link rel="modulepreload" href="js/values.js" />
    <link rel="modulepreload" href="js/histogram.js" />
    <link rel="modulepreload" href="js/colormaps.js" />
  </head>
  <body>
    <div id="map"></div>

    <!-- The shell clips the oversized glass pane; a sibling pane stays fixed behind
         the scrolling panel. -->
    <div id="panel-shell">
      <div id="panel-glass" aria-hidden="true"></div>
      <aside id="panel">
        <header>
          <div>
            <!-- Outlined glyphs need no webfont. -->
            <h1 id="title">
              <img src="assets/glace-wordmark.svg" alt="GLACE" width="2074" height="419" />
            </h1>
            <p id="subtitle">Sentinel-1 annual summer composites of the European Alps</p>
          </div>

          <button type="button" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">
            <span class="chevron" aria-hidden="true"
                  ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
                ></span>
          </button>
        </header>

        <div id="panel-body">

          <!-- Hide raster controls together when the catalog is unavailable. -->
          <div id="raster-controls">
            <section class="control">
              <label for="product">Product</label>
              <div id="product" class="segmented" role="radiogroup" aria-label="Product"></div>
            </section>

            <!-- Hide the Layer row when the catalog offers only one quantity. -->
            <section class="control" id="quantity-row" hidden>
              <label for="quantity">Layer</label>
              <div id="quantity" class="segmented" role="radiogroup" aria-label="Layer"></div>
            </section>

            <section class="control">
              <label for="pol">Polarization</label>
              <div id="pol" class="segmented" role="radiogroup" aria-label="Polarization"></div>
            </section>

            <section class="control">
              <label for="year">Year <output id="year-value"></output></label>
              <input type="range" id="year" step="1" />
              <div id="year-ticks" class="ticks"></div>
            </section>

            <section class="control">
              <label for="opacity">Layer opacity <output id="opacity-value">100%</output></label>
              <input type="range" id="opacity" min="0" max="100" value="100" step="1" />
            </section>

            <section id="legend" class="control">
              <div class="control-head">
                <span class="label">Scale <span id="cmap"></span></span>
                <!-- Value-encoded layers open the scale editor below; a click anywhere
                     on the legend presses this button. -->
                <button type="button" id="legend-edit" aria-label="Edit the scale"
                        aria-controls="scale-editor" aria-expanded="false">Edit</button>
              </div>
              <div id="legend-bar"></div>
              <div id="legend-labels">
                <span class="limit"><span id="legend-min"></span><span class="unit"></span></span>
                <span class="limit"><span id="legend-max"></span><span class="unit"></span></span>
              </div>
              <!-- False-color channel legend, shown in place of the color ramp. -->
              <div id="legend-channels" hidden></div>
            </section>

            <p id="layer-info"></p>
          </div>

          <hr />

          <details class="control" id="inventories-section" hidden>
            <summary id="inventories-toggle">
              <span>Glacier inventories</span><span class="chevron" aria-hidden="true"
                    ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                          stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
                  ></span>
            </summary>
            <div id="inventories"></div>
          </details>

          <!-- Hide this separator with empty inventories. -->
          <hr id="inventories-rule" />

          <details class="control" id="extras-section">
            <summary id="extras-toggle">
              <span>Map options</span><span class="chevron" aria-hidden="true"
                    ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                          stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                          stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
                  ></span>
            </summary>
            <div id="extras">
              <section class="control">
                <div id="basemap-style" class="segmented" role="radiogroup" aria-label="Basemap"></div>
              </section>

              <section class="control checkbox" id="hillshade-row">
                <input type="checkbox" id="hillshade" />
                <label for="hillshade">Hillshade</label>
              </section>
              <section class="control" id="hillshade-strength-row" hidden>
                <label for="hillshade-strength">
                  Hillshade strength <output id="hillshade-strength-value">55%</output>
                </label>
                <input type="range" id="hillshade-strength" min="0" max="100" value="55" step="1" />
              </section>

              <section class="control checkbox">
                <input type="checkbox" id="grid" />
                <label for="grid">Catalog tile grid</label>
              </section>

              <section class="control checkbox">
                <input type="checkbox" id="basemap" checked />
                <label for="basemap">Basemap labels</label>
              </section>
            </div>
          </details>
        </div>
      </aside>
    </div>

    <div id="status" hidden></div>

    <!-- The scale editor: changes apply to the map as they are made. Beside the panel
         on wide screens; on narrow ones it takes the panel's place. -->
    <dialog id="scale-editor" aria-label="Scale">
      <div class="glass" aria-hidden="true"></div>
      <div class="sheet">
        <header>
          <h2>Values <span class="context">current view</span></h2>
          <button type="button" class="close" aria-label="Close" title="Close" autofocus
            ><svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor"
                  stroke-width="1.8" stroke-linecap="round" aria-hidden="true"
              ><path d="M3 3 9 9M9 3 3 9" /></svg
          ></button>
        </header>

        <!-- The values in view over every code the archive can draw, with the limits
             as handles. The fields below are the same limits for keyboards. -->
        <div id="histogram" role="img" aria-label="Histogram of the values in view">
          <svg viewBox="0 0 255 64" preserveAspectRatio="none" aria-hidden="true"
            ><path id="histogram-bars" /></svg>
          <div class="shade low"></div>
          <div class="shade high"></div>
          <div class="handle low" aria-hidden="true"></div>
          <div class="handle high" aria-hidden="true"></div>
          <span id="histogram-note"></span>
        </div>
        <div id="editor-bar"></div>

        <div class="limits">
          <div class="limit">
            <label for="vmin">Min</label>
            <label class="field" for="vmin"><input id="vmin" autocomplete="off"
              spellcheck="false" aria-describedby="limits-hint" /><span class="unit"></span></label>
          </div>
          <div class="limit">
            <label for="vmax">Max</label>
            <label class="field" for="vmax"><input id="vmax" autocomplete="off"
              spellcheck="false" aria-describedby="limits-hint" /><span class="unit"></span></label>
          </div>
          <button type="button" id="range-reset" title="Reset to the default limits"
                  aria-label="Reset to the default limits"
            ><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
                  stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                  aria-hidden="true"
              ><path d="M3.5 8a4.5 4.5 0 1 0 1.3-3.2" /><path d="M4.5 2.3v2.8h2.8" /></svg
          ></button>
        </div>
        <div class="presets">
          <button type="button" id="range-percentile"
                  title="Limits at the 2nd and 98th percentiles of the values in view">2–98%</button>
          <button type="button" id="range-extent"
                  title="Limits at the lowest and highest values in view">Min/Max</button>
        </div>
        <!-- Shown only while a typed limit is refused, to say why. -->
        <p id="limits-hint" role="status"></p>

        <h3 id="cmap-options-title">Color map</h3>
        <div id="cmap-options" role="group" aria-labelledby="cmap-options-title"></div>
      </div>
    </dialog>
    <!-- Expose library globals before app.js so tests can substitute fakes. -->
    <script type="module">
      import * as maplibregl from "maplibre-gl";
      import * as pmtiles from "pmtiles";
      import * as basemaps from "@protomaps/basemaps";
      Object.assign(globalThis, { maplibregl, pmtiles, basemaps });
    </script>
    <!-- Load deployment overrides before application modules: deferred scripts and
         modules run in document order. -->
    <script defer src="site-config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
