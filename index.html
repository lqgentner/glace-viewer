<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GLACE — Sentinel-1 composites, European Alps</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <aside id="panel">
      <header>
        <div>
          <h1 id="title">GLACE</h1>
          <p id="subtitle">Sentinel-1 annual summer composites of the European Alps</p>
        </div>
        <!-- Collapses everything below the title. The panel covers most of a
             phone screen, so there it opens collapsed — see js/app.js. -->
        <button type="button" id="panel-toggle" aria-expanded="true" aria-controls="panel-body">
          <span class="chevron" aria-hidden="true"
                ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                      stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                      stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
              ></span>
        </button>
      </header>

      <div id="panel-body">

        <!-- Everything that describes a raster layer. Hidden as a block when
             layers.json cannot be reached, since none of it means anything then. -->
        <div id="raster-controls">
          <section class="control">
            <label for="product">Product</label>
            <div id="product" class="segmented" role="radiogroup" aria-label="Product"></div>
          </section>

          <section class="control">
            <label for="pol">Polarization</label>
            <div id="pol" class="segmented" role="radiogroup" aria-label="Polarization"></div>
          </section>

          <section class="control">
            <label for="year">Year <output id="year-value"></output></label>
            <input type="range" id="year" step="1" />
            <div id="year-ticks" class="ticks"></div>
          </section>

          <section class="control">
            <label for="opacity">Layer opacity <output id="opacity-value">100%</output></label>
            <input type="range" id="opacity" min="0" max="100" value="100" step="1" />
          </section>

          <section id="legend" class="control">
            <div class="control-head">
              <label>Scale</label>
              <!-- Colour-map credit, appended by js/rasters.js: which map it is
                   depends on the layer, so the button is rebuilt when it changes. -->
              <span id="legend-credit"></span>
            </div>
            <div id="legend-bar"></div>
            <div id="legend-labels"><span id="legend-min"></span><span id="legend-max"></span></div>
          </section>

          <!-- What the selected layer is. Sits under the ramp rather than in a
               footer: it describes the thing the controls above just chose. -->
          <p id="layer-info"></p>
        </div>

        <hr />

        <section class="control" id="inventories-section" hidden>
          <!-- Starts collapsed: three overlays that are all off by default do not
               need to take up the panel before anyone asks for them. -->
          <button type="button" id="inventories-toggle" aria-expanded="false"
                  aria-controls="inventories">
            <span>Glacier inventories</span><span class="chevron up" aria-hidden="true"
                  ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
                ></span>
          </button>
          <div id="inventories" hidden></div>
        </section>

        <!-- Hidden along with the inventories above it, so a page with no
             inventory index does not show two rules in a row. -->
        <hr id="inventories-rule" />

        <section class="control" id="extras-section">
          <!-- Same reasoning as the inventories above: everything in here is off
               by default (bar the basemap labels) and nobody needs it on arrival. -->
          <button type="button" id="extras-toggle" aria-expanded="false" aria-controls="extras">
            <span>Map options</span><span class="chevron up" aria-hidden="true"
                  ><svg viewBox="0 0 12 12" width="12" height="12" fill="none"
                        stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round"><path d="M2.5 4.5 6 8 9.5 4.5" /></svg
                ></span>
          </button>
          <div id="extras" hidden>
            <section class="control checkbox" id="hillshade-row">
              <input type="checkbox" id="hillshade" />
              <label for="hillshade">Hillshade</label>
            </section>
            <section class="control" id="hillshade-strength-row" hidden>
              <label for="hillshade-strength">
                Hillshade strength <output id="hillshade-strength-value">55%</output>
              </label>
              <input type="range" id="hillshade-strength" min="0" max="100" value="55" step="1" />
            </section>

            <section class="control checkbox">
              <input type="checkbox" id="grid" />
              <label for="grid">Catalog tile grid</label>
            </section>

            <section class="control checkbox">
              <input type="checkbox" id="basemap" checked />
              <label for="basemap">Basemap labels</label>
            </section>
          </div>
        </section>
      </div>
    </aside>

    <div id="status" hidden></div>

    <script src="https://unpkg.com/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/pmtiles@4.4.0/dist/pmtiles.js"></script>
    <script src="https://unpkg.com/@protomaps/basemaps@5.7.2/dist/basemaps.js" crossorigin="anonymous"></script>
    <!-- Optional per-deployment overrides; must run before the modules do. -->
    <script src="site-config.js"></script>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
